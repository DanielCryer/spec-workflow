name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Portability
        run: sh scripts/check-portability.sh

      - name: Gate tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest skills/spec-driven-development/scripts -q
