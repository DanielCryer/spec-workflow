name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Portability
        run: sh scripts/check-portability.sh

      - name: Docs links
        run: python3 scripts/check-links.py

      - name: Frontmatter
        run: python3 scripts/check-frontmatter.py

      - name: Release tag
        if: github.event_name == 'push'
        run: python3 scripts/check-release.py

      - name: Gate on the template
        run: |
          python3 skills/spec-driven-development/scripts/spec_check.py \
            --spec templates/specs-repo/tasks/_example --strict

      - name: Gate tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest skills/spec-driven-development/scripts scripts -q
